<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HandWave On-Screen Keyboard</title>
  <link rel="stylesheet" href="keyboard.css">
</head>
<body>
  <div id="kb-container">
    <div id="kb-display"></div>
    <div class="kb-row">
      <button data-key="q">q</button><button data-key="w">w</button><button data-key="e">e</button><button data-key="r">r</button><button data-key="t">t</button>
      <button data-key="y">y</button><button data-key="u">u</button><button data-key="i">i</button><button data-key="o">o</button><button data-key="p">p</button>
    </div>
    <div class="kb-row">
      <button data-key="a">a</button><button data-key="s">s</button><button data-key="d">d</button><button data-key="f">f</button><button data-key="g">g</button>
      <button data-key="h">h</button><button data-key="j">j</button><button data-key="k">k</button><button data-key="l">l</button><button data-key="Backspace">⌫</button>
    </div>
    <div class="kb-row">
      <button data-key="Shift">⇧</button><button data-key="z">z</button><button data-key="x">x</button><button data-key="c">c</button><button data-key="v">v</button>
      <button data-key="b">b</button><button data-key="n">n</button><button data-key="m">m</button><button data-key=".">.</button><button data-key="Enter">↵</button>
    </div>
    <div class="kb-row">
      <button data-key=" ">Space</button>
    </div>
  </div>
  <script src="keyboard.js"></script>
</body>
</html>
